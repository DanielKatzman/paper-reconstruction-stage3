name: Stage 3 v2 contracts and CPU runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -B tools/verify_release.py
      - run: python -B scripts/test.py
